name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `public` is no longer a submodule, and nothing else in the tree is one.
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Pinned to the same image as docker-compose.yml so CI and local builds
      # match. Run as the runner's own user so the generated `public` is
      # writable, and keep the cache off the image's root-owned /cache for the
      # same reason.
      - name: Build
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HUGO_CACHEDIR=/tmp/hugo-cache \
            -v "$PWD:/project" -w /project \
            ghcr.io/gohugoio/hugo:v0.166.0 \
            --gc --minify --cleanDestinationDir

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    # Branch pushes and manual dispatches build, but only master deploys.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
