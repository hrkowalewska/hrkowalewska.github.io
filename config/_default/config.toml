title = "Helen Kowalewska"
baseurl = "https://helenkowalewska.uk/"
copyright = "Helen Kowalewska &copy; {year}"

defaultContentLanguage = "en"
enableEmoji = true
# Workaround for https://github.com/gohugoio/hugo/issues/5687
removePathAccents = true

# The News section is retired. Switching it back on means reversing all three of:
#   1. this ignoreFiles entry,
#   2. the commented-out News block in menus.toml,
#   3. adding content/post/_index.md back.
# Changing only one leaves an empty section rendering.
ignoreFiles = ["content/post/"]

[pagination]
  pagerSize = 20

[outputs]
  # JSON on the home page is the search index, built by layouts/home.json. It
  # covers the data files too, so it is not derivable from the rendered pages.
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[imaging]
  resampleFilter = "lanczos"
  anchor = "smart"
  [imaging.jpeg]
    quality = 90
  [imaging.webp]
    quality = 82

# No taxonomies. tags, categories and publication_types were declared by the old
# theme and were empty in every file, and `authors` collided with content/authors/
# as a section. Templates read the author pages directly instead.
[taxonomies]

[markup]
  [markup.goldmark.renderer]
    # The take-part page carries hand-written HTML.
    unsafe = true
