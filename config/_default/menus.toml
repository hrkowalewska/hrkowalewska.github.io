# Real section pages, not homepage anchors. The old menu pointed "Publications"
# at #featured, which showed only pages with `featured: true` — exactly one.
#
# Every homepage section has a destination here, so nothing on the site is
# reachable only by scrolling.

[[main]]
  name = "Publications"
  url = "/publication/"
  weight = 10

[[main]]
  name = "In public"
  url = "/media/"
  weight = 20

[[main]]
  name = "Talks"
  url = "/talk/"
  weight = 30

[[main]]
  name = "Projects"
  url = "/project/"
  weight = 40

[[main]]
  name = "Teaching"
  url = "/teaching/"
  weight = 50

# Shorter than the page's own title, "Grants and awards", to keep the bar from
# getting unwieldy. Hugo lets the two differ.
[[main]]
  name = "Awards"
  url = "/awards/"
  weight = 55

[[main]]
  name = "About"
  url = "/authors/helen/"
  weight = 60

