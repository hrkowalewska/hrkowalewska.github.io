<script>
// Search, and the listing filter, which are the same matcher wearing two hats.
//
// The index is fetched once, the first time search is opened, and never on a
// page that nobody searches from. Every record's url was resolved at build time
// by layouts/home.json through showpage.html, so this file never decides where a
// result goes: an item with a page of its own links to it, everything else links
// to its listing carrying ?q=, and the filter below picks that up on arrival.
//
// Matching is deliberately plain. Every token must appear somewhere in the
// record, and a record matching in its title sorts first. At 86 items that beats
// stemming and ranking for both size and surprise.
(function () {
  var dlg = document.getElementById('search');
  var openers = document.querySelectorAll('[data-search-open]');
  if (!dlg || !dlg.showModal) return;

  // --- the shared matcher -------------------------------------------------
  // Diacritics folded so "Ozcan" finds "Özcan", punctuation flattened so a
  // curly apostrophe never decides whether something is found.
  function norm(s) {
    return (s || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }
  function tokens(q) { return norm(q).split(' ').filter(Boolean); }
  function hits(haystack, toks) {
    for (var i = 0; i < toks.length; i++) if (haystack.indexOf(toks[i]) < 0) return false;
    return true;
  }

  // --- the listing filter -------------------------------------------------
  // Runs on any page with a ledger. Hides rows that do not match, then hides
  // any year heading left with nothing under it, of which /media/ has seven.
  var ledgers = document.querySelectorAll('.ledger');
  var filterBox = document.getElementById('list-filter');
  var filterClear = document.getElementById('list-filter-clear');

  function clearFilter() {
    filterBox.value = '';
    filterList('');
    filterBox.focus();
    // Drop ?q= so a reload, a bookmark or a back button does not refill it.
    if (location.search) history.replaceState(null, '', location.pathname + location.hash);
  }

  function filterList(q) {
    var toks = tokens(q), shown = 0, total = 0;
    ledgers.forEach(function (led) {
      led.querySelectorAll('.entry').forEach(function (row) {
        total++;
        var hay = row.__hay || (row.__hay = norm(row.textContent));
        var on = !toks.length || hits(hay, toks);
        row.hidden = !on;
        if (on) shown++;
      });
    });
    document.querySelectorAll('.year-group').forEach(function (g) {
      g.hidden = !g.querySelector('.entry:not([hidden])');
    });
    var out = document.getElementById('list-filter-count');
    if (out) out.textContent = toks.length ? (shown + ' of ' + total) : '';
    var none = document.getElementById('list-filter-empty');
    if (none) none.hidden = !(toks.length && shown === 0);
    if (filterClear) filterClear.hidden = !filterBox.value;
  }

  if (filterBox) {
    filterBox.closest('.list-filter').hidden = false;
    filterBox.addEventListener('input', function () { filterList(filterBox.value); });
    filterBox.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && filterBox.value) { e.preventDefault(); clearFilter(); }
    });
    if (filterClear) filterClear.addEventListener('click', clearFilter);
    // Arriving from a search result, or from a shared link.
    var q = new URLSearchParams(location.search).get('q');
    if (q) { filterBox.value = q; filterList(q); }
  }

  // --- the dialog ---------------------------------------------------------
  var input = document.getElementById('search-input');
  var list = document.getElementById('search-results');
  var count = document.getElementById('search-count');
  var items = null, loading = false, active = -1;

  openers.forEach(function (b) { b.hidden = false; });

  function load() {
    if (items || loading) return Promise.resolve();
    loading = true;
    return fetch({{ "/index.json" | relURL }})
      .then(function (r) { return r.json(); })
      .then(function (d) {
        items = d.items.map(function (x) { x._t = norm(x.title); x._a = norm(x.text); return x; });
      })
      .catch(function () { items = []; count.textContent = 'Search is unavailable.'; })
      .then(function () { loading = false; });
  }

  function render(q) {
    var toks = tokens(q);
    list.innerHTML = '';
    active = -1;
    if (!toks.length) { count.textContent = items ? items.length + ' items' : ''; return; }
    var found = [];
    for (var i = 0; i < (items || []).length; i++) {
      var it = items[i];
      if (hits(it._a, toks)) found.push({ it: it, rank: hits(it._t, toks) ? 0 : 1 });
    }
    found.sort(function (a, b) { return a.rank - b.rank || b.it.year - a.it.year; });
    count.textContent = found.length ? found.length + (found.length === 1 ? ' result' : ' results')
                                     : 'Nothing matches ' + JSON.stringify(q) + '.';
    found.slice(0, 40).forEach(function (f) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = f.it.url;
      // The rail names the section, so a result says where it is going to send
      // you. What kind of thing it is moves down to the line beneath.
      a.innerHTML = '<span class="search-kind"></span>' +
                    '<span class="search-title"></span>' +
                    '<span class="search-where"></span>';
      a.querySelector('.search-kind').textContent = f.it.group || f.it.section;
      a.querySelector('.search-title').textContent = f.it.title;
      a.querySelector('.search-where').textContent =
        [f.it.kind, f.it.where, f.it.year].filter(Boolean).join(' · ');
      li.appendChild(a);
      list.appendChild(li);
    });
    if (found.length > 40) count.textContent += ', showing the first 40';
  }

  function move(step) {
    var as = list.querySelectorAll('a');
    if (!as.length) return;
    active = (active + step + as.length) % as.length;
    as.forEach(function (a, i) { a.classList.toggle('is-active', i === active); });
    as[active].scrollIntoView({ block: 'nearest' });
  }

  function open() {
    // Never two overlays. The drawer carries the trigger on narrow screens, so
    // it is usually the thing that opened this.
    var head = document.querySelector('.masthead.is-open');
    if (head) document.getElementById('nav-toggle').click();
    dlg.showModal();
    input.value = '';
    load().then(function () { render(''); });
    input.focus();
  }

  openers.forEach(function (b) { b.addEventListener('click', open); });
  dlg.querySelectorAll('[data-search-close]').forEach(function (b) {
    b.addEventListener('click', function () { dlg.close(); });
  });

  input.addEventListener('input', function () { render(input.value); });
  input.addEventListener('keydown', function (e) {
    // A search input eats Escape to clear itself, so the dialog never sees the
    // key and never closes. Handle it here rather than relying on the native
    // cancel behaviour.
    if (e.key === 'Escape') { e.preventDefault(); dlg.close(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') {
      var a = list.querySelectorAll('a')[active < 0 ? 0 : active];
      if (a) { e.preventDefault(); a.click(); }
    }
  });

  // showModal() puts the dialog in the top layer, so a click landing on the
  // dialog element itself is a click on the backdrop around it.
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });

  // "/" to open, the convention, but not while typing somewhere else.
  document.addEventListener('keydown', function (e) {
    if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || e.target.isContentEditable) return;
    if (dlg.open) return;
    e.preventDefault();
    open();
  });
})();
</script>
