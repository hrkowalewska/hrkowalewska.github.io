name: helenkowalewska.uk

services:
  server:
    # Official image from the Hugo project. Only the extended build is published.
    # Kept in step with the version in .github/workflows/deploy.yml.
    image: ghcr.io/gohugoio/hugo:v0.166.0
    # The image entrypoint is Hugo itself, so this starts at the subcommand.
    command: server -D --bind 0.0.0.0
    working_dir: /project
    volumes:
      - ./:/project
      # Named volume rather than a host path, so the image's non-root user can write it.
      - hugo_cache:/cache
    ports:
      - 1313:1313

volumes:
  hugo_cache:
