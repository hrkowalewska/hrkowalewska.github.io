# Teaching, most recent first. Rendered by _partials/stack.html as ledger rows,
# the same markup the publications and media lists use.
#
# `kind` is the role, and it fills the small label under the year in the rail.
# It is the reason the titles are bare unit names: "Lecturer for 'Population
# Processes'" would say the role twice. Keep it to two words, because the rail
# is only as wide as a four-digit year.
#
# `note` may contain Markdown and renders as its own paragraph. A `link` with a
# `link_label` renders as a chip, which is where the unit handbook lives.
