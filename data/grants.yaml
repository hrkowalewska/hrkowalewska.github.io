# Grants, prizes and nominations, most recent first. Rendered by
# _partials/stack.html as ledger rows, the same markup the publications and
# media lists use.
#
# `kind` fills the small label under the year in the rail, as the pubtype does
# on a publication. The section mixes funding with honours, so without it a
# reader scanning the page cannot tell a grant from a prize. Keep it to one
# word, because the rail is only as wide as a four-digit year.
#
# `note` is optional Markdown and renders as its own paragraph under the org.
#
# `page` is where the title links to, and without it the title is flat. Three
# of these funded projects that are written up at length on this site, so they
# point at them. The rest have nowhere to go.
